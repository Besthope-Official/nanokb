[package]
name = "nanokb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
annotate-snippets = "0.12.16"
anstream = "0.6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
lopdf = { version = "0.39", optional = true }
pgvector = { version = "0.4", features = ["sqlx"] }
pulldown-cmark = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
yaml_serde = "0.10"
pdfium-render = { version = "0.9.3", features = ["image_api", "pdfium_latest", "thread_safe"], optional = true }
pdfium-bundled = { version = "0.1.1", features = ["bundled"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
governor = { version = "0.10.4", optional = true }

[features]
default = []
pdf = ["dep:lopdf", "dep:sha2", "dep:pdfium-render", "dep:pdfium-bundled", "dep:image", "dep:governor", "reqwest/multipart"]

[dev-dependencies]
rstest = "0.26"
