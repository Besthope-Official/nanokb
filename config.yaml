database:
  url: "postgres://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}"
  index:
    type: hnsw
    m: 16
    ef_construction: 64
    ef_search: 40

model:
  embeddings:
    bge_m3:
      model_name: "BAAI/bge-m3"
      api_base: "{BGE_M3_EMBED_API_BASE}"
      api_key: "{BGE_M3_EMBED_API_KEY}"
      batch_size: 32
    qwen3:
      model_name: "qwen3.7-text-embedding"
      api_base: "{QWEN_EMBED_API_BASE}"
      api_key: "{QWEN_EMBED_API_KEY}"
      batch_size: 20
  llms:
    deepseek:
      model_name: "deepseek-v4-flash"
      api_base: "{DEEPSEEK_API_BASE}"
      api_key: "{DEEPSEEK_API_KEY}"
      temperature: 0.2
      max_tokens: 2048
      concurrency: 5
      reasoning_effort: "low"
  rerankers:
    bge_reranker:
      model_name: "BAAI/bge-reranker-v2-m3"
      api_base: "{BGE_M3_RERANKER_API_BASE}"
      api_key: "{BGE_M3_RERANKER_API_KEY}"

pipeline:
  embedding: bge_m3
  llm: deepseek
  query_mode: hybrid
  worker_count: 4
  top_k: 5
  max_chunk_tokens: 256
  chunk_overlap_ratio: 0.1
  worker_poll_timeout_secs: 30
  worker_error_retry_secs: 5